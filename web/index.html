<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DesktopShell · M2 测试页</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
    body { display: grid; place-items: center; color: white; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; }
    main { box-sizing: border-box; max-width: calc(100% - 48px); padding: 28px; text-align: center; border-radius: 20px; background: rgba(20, 20, 30, 0.45); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    h1 { margin: 0 0 20px; font-size: 24px; }
    img { display: block; width: 480px; max-width: 100%; height: auto; margin: 0 auto 20px; }
    p { margin: 12px 0; }
    button { margin-top: 8px; padding: 10px 18px; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 10px; background: rgba(255, 255, 255, 0.12); color: inherit; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
    #audio-status { max-width: 480px; overflow-wrap: anywhere; }
    #audio-status:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>DesktopShell · M2 测试页</h1>
    <img src="/media/ornaments/heart.png" alt="心形装饰条">
    <p>ES module：<span id="module-status">…</span></p>
    <p>路径穿越测试：<span id="path-status">…</span></p>
    <button id="play-voice" type="button">播放测试语音</button>
    <p id="audio-status" role="status" aria-live="polite"></p>
  </main>
  <script type="module">
    import { moduleStatus } from './m2-check.js';
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.getElementById('module-status').textContent = moduleStatus;
    const panel = document.querySelector('main');
    function reportHitRegions() {
      const { x, y, width, height } = panel.getBoundingClientRect();
      window.webkit?.messageHandlers?.shell?.postMessage({
        action: 'setHitRegions', regions: [[x, y, width, height]]
      });
    }
    window.addEventListener('load', reportHitRegions);
    window.addEventListener('resize', reportHitRegions);
    // Image loading and status text can resize the panel without resizing the window.
    new ResizeObserver(reportHitRegions).observe(panel);
    reportHitRegions();
    const pathStatus = document.getElementById('path-status');
    try {
      const response = await fetch('/media/..%2fconfig.json');
      pathStatus.textContent = response.status === 404 ? '404 ✓' : `${response.status} ✗`;
    } catch (error) {
      pathStatus.textContent = `${error.message} ✗`;
    }

    let audio;
    document.getElementById('play-voice').addEventListener('click', async () => {
      const status = document.getElementById('audio-status');
      status.textContent = '';
      if (audio) audio.pause();
      audio = new Audio('/media/voice/1.mp3');
      audio.addEventListener('error', () => {
        status.textContent = `语音播放失败：${audio.error?.message || '媒体读取或解码错误'}`;
      });
      try {
        await audio.play();
      } catch (error) {
        status.textContent = `语音播放失败：${error.message}`;
      }
    });
  </script>
</body>
</html>
