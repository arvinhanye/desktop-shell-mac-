<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta HTTP-EQUIV="Content-Security-Policy" content="default-src 'self' shell:; style-src 'self' shell: 'unsafe-inline'; img-src 'self' shell: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>终端</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="terminal/terminal.css">
  <script defer src="vendor/xterm/xterm.js"></script>
  <script defer src="vendor/xterm-addon-fit/addon-fit.js"></script>
  <script type="module" src="terminal/terminal.js"></script>
</head>
<body>
        <div class="terminal-panel">
          <header class="terminal-bar">
            <span class="terminal-title"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M3.5 5l4 4-4 4M9.5 13.5h5"/></svg>终端</span>
            <span class="terminal-meta" id="terminal-meta"></span>
            <kbd class="key-hint" id="terminal-key" hidden></kbd>
            <div class="terminal-actions">
              <button class="terminal-button" id="terminal-max" type="button" aria-label="放大" title="放大"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9.5 6.5M2.5 13.5l4-4"/></svg></button>
              <button class="terminal-button" id="terminal-close" type="button" aria-label="收起" title="收起"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
            </div>
          </header>
          <div class="terminal-screen"></div>
        </div>
</body>
</html>
